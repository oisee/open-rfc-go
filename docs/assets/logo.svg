<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 132" width="640" height="132"
     role="img" aria-label="open-rfc-go — SAP classic RFC, client and server, pure Go">
  <title>open-rfc-go</title>
  <style>
    /* Mid-tones chosen to stay legible on a light or a dark page. */
    .wire  { stroke:#7c8798; stroke-width:2; fill:none }
    .cell  { stroke:#7c8798; stroke-width:2; fill:none }
    .tag   { fill:#2f81f7; font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace }
    .val   { fill:#7c8798; font:400 15px ui-monospace,SFMono-Regular,Menlo,monospace }
    .name  { fill:#2f81f7; font:700 34px ui-monospace,SFMono-Regular,Menlo,monospace }
    .sub   { fill:#7c8798; font:400 14px ui-monospace,SFMono-Regular,Menlo,monospace }
    .accent{ fill:#e3963e }
  </style>

  <!-- the wire, entering and leaving -->
  <path class="wire" d="M4 40 H28 M612 40 H636"/>

  <!-- one framed record, as the decoder sees it -->
  <g>
    <rect class="cell" x="28"  y="20" width="44"  height="40" rx="3"/>
    <rect class="cell" x="72"  y="20" width="96"  height="40"/>
    <rect class="cell" x="168" y="20" width="44"  height="40"/>
    <rect class="cell" x="212" y="20" width="132" height="40"/>
    <rect class="cell" x="344" y="20" width="44"  height="40"/>
    <rect class="cell" x="388" y="20" width="140" height="40"/>
    <rect class="cell" x="528" y="20" width="44"  height="40" rx="3"/>

    <text class="tag" x="50"  y="45" text-anchor="middle">06</text>
    <text class="val" x="120" y="45" text-anchor="middle">CPIC</text>
    <text class="tag" x="190" y="45" text-anchor="middle">cb</text>
    <text class="val" x="278" y="45" text-anchor="middle">\TYPE=I</text>
    <text class="tag" x="366" y="45" text-anchor="middle">4e</text>
    <text class="val" x="458" y="45" text-anchor="middle">15 00 00 00</text>
    <text class="tag accent" x="550" y="45" text-anchor="middle">45</text>
  </g>

  <text class="name" x="28" y="100">open-rfc-go</text>
  <text class="sub"  x="28" y="122">SAP classic RFC · client and server · pure Go · no SDK, no cgo</text>
</svg>
